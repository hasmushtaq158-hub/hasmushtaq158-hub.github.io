<style>:root{font-family:Arial,system-ui,sans-serif;color:#172238;background:#f2f5f8;font-synthesis:none;--navy:#172238;--gold:#e4a321;--muted:#677386;--red:#b73737;--green:#21825c;--line:#dfe5eb;--card:#fff}
*{box-sizing:border-box}
body{margin:0;min-width:320px;overflow-x:hidden;background:radial-gradient(circle at 85% 0,#fff4d6 0,transparent 27rem),#f2f5f8}
button,input,select{font:inherit}
button{cursor:pointer}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 22px 70px #17223818}
.brand{display:flex;align-items:center;gap:13px;font-weight:800;font-size:22px}
.mark{width:43px;height:43px;background:var(--gold);border-radius:13px;display:grid;place-items:center;color:var(--navy)}
h1{font-size:30px;line-height:1.15;margin:25px 0 8px}
h2{margin:0;font-size:23px}
.muted{color:var(--muted)}
.field{display:grid;gap:7px;margin:14px 0}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.select{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 13px;background:#f8fafb;color:var(--navy);width:100%}
.field input:focus,.field select:focus{outline:3px solid #e4a32133;border-color:var(--gold)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:var(--navy);color:#fff;min-height:44px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.btn.ghost{background:#eef2f5;color:var(--navy)}
.btn.small{padding:8px 11px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--navy);color:#fff;padding:23px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sidebar .brand{padding:0 8px 24px}
.nav{display:grid;gap:6px}
.nav button{border:0;background:transparent;color:#bfc9d5;text-align:left;padding:12px 13px;border-radius:11px;font-weight:650}
.nav button:hover,.nav button.active{background:#ffffff12;color:#fff}
.userbox{margin-top:auto;border-top:1px solid #ffffff1c;padding:18px 8px 0;font-size:13px}
.main{padding:28px 30px 50px;max-width:1500px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}
.topbar p{margin:5px 0 0}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:17px}
.metric{padding:17px}
.metric span{font-size:12px;color:var(--muted);font-weight:700}
.metric strong{display:block;font-size:27px;margin-top:7px}
.card{padding:20px;margin-top:16px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:#edf1f4}
.status.open{background:#daf3e8;color:#176644}
.status.closed{background:#f7dfdf;color:#8d2525}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.code{font-size:30px;letter-spacing:.18em;font-weight:800;background:#fff7df;border:1px solid #f3d68a;border-radius:13px;padding:10px 15px;display:inline-block}
.tablewrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:760px}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}
.table td{padding:11px 10px;border-bottom:1px solid #edf0f3;font-size:13px;vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.amount{font-weight:800;white-space:nowrap}
.empty{text-align:center;padding:40px;color:var(--muted)}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.attrlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.attr{border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.attr strong{display:block}
.attr small{color:var(--muted)}
.modalback{position:fixed;inset:0;background:#10182799;display:grid;place-items:center;padding:18px;z-index:20}
.modal{width:min(500px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 30px 90px #0005}
.modal h3{margin:0 0 8px}
.notice{padding:12px 14px;background:#fff7df;border:1px solid #f1d179;border-radius:12px;margin:14px 0}
.danger{color:var(--red)}
#toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;border-radius:12px;padding:13px 17px;box-shadow:0 10px 40px #0004;opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:none}
.mobilebar,.menu-toggle,.menu-backdrop{display:none}
@media(max-width:980px){.layout{grid-template-columns:1fr}
.sidebar{display:flex;position:fixed;left:0;top:0;width:min(84vw,320px);height:100dvh;z-index:50;transform:translateX(-105%);transition:transform .22s ease;box-shadow:18px 0 50px #08101f55}
.sidebar.open{transform:translateX(0)}
.menu-toggle{display:grid;place-items:center;position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));z-index:45;width:58px;height:58px;border:0;border-radius:18px;background:var(--navy);color:#fff;font-size:0;box-shadow:0 12px 32px #15233b38}
.menu-toggle:before{content:"☰";font-size:34px;line-height:1}
.menu-toggle[aria-expanded="true"]:before{content:"×";font-size:39px}
.menu-backdrop{position:fixed;inset:0;z-index:49;background:#08101f80;backdrop-filter:blur(2px)}
.menu-backdrop.show{display:block}
.main{min-width:0;max-width:100vw;padding:86px 14px 32px;overflow:hidden}
.grid{grid-template-columns:repeat(2,1fr)}
.split{grid-template-columns:1fr}
.split,.split>*,.card,.tablewrap,.report-toolbar,.report-heading{min-width:0;max-width:100%}
.tablewrap{width:100%;overflow-x:auto;overscroll-behavior-inline:contain}
.topbar{padding-right:64px}
.empty{padding:24px 12px;white-space:normal;overflow-wrap:anywhere}
}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}
.metric strong{font-size:22px}
.topbar{display:block}
.actions{margin-top:14px}
.attrlist{grid-template-columns:1fr}
.auth{padding:23px}
.main{padding-inline:12px}
