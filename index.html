<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172238">
<title>Парк — панель директора</title>
<style>:root{font-family:Arial,system-ui,sans-serif;color:#172238;background:#f2f5f8;font-synthesis:none;--navy:#172238;--gold:#e4a321;--muted:#677386;--red:#b73737;--green:#21825c;--line:#dfe5eb;--card:#fff}
*{box-sizing:border-box}
body{margin:0;min-width:320px;overflow-x:hidden;background:radial-gradient(circle at 85% 0,#fff4d6 0,transparent 27rem),#f2f5f8}
button,input,select{font:inherit}
button{cursor:pointer}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 22px 70px #17223818}
.brand{display:flex;align-items:center;gap:13px;font-weight:800;font-size:22px}
.mark{width:43px;height:43px;background:var(--gold);border-radius:13px;display:grid;place-items:center;color:var(--navy)}
h1{font-size:30px;line-height:1.15;margin:25px 0 8px}
h2{margin:0;font-size:23px}
.muted{color:var(--muted)}
.field{display:grid;gap:7px;margin:14px 0}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.select{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 13px;background:#f8fafb;color:var(--navy);width:100%}
.field input:focus,.field select:focus{outline:3px solid #e4a32133;border-color:var(--gold)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:var(--navy);color:#fff;min-height:44px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.btn.ghost{background:#eef2f5;color:var(--navy)}
.btn.small{padding:8px 11px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--navy);color:#fff;padding:23px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sidebar .brand{padding:0 8px 24px}
.nav{display:grid;gap:6px}
.nav button{border:0;background:transparent;color:#bfc9d5;text-align:left;padding:12px 13px;border-radius:11px;font-weight:650}
.nav button:hover,.nav button.active{background:#ffffff12;color:#fff}
.userbox{margin-top:auto;border-top:1px solid #ffffff1c;padding:18px 8px 0;font-size:13px}
.main{padding:28px 30px 50px;max-width:1500px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}
.topbar p{margin:5px 0 0}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:17px}
.metric{padding:17px}
.metric span{font-size:12px;color:var(--muted);font-weight:700}
.metric strong{display:block;font-size:27px;margin-top:7px}
.card{padding:20px;margin-top:16px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:#edf1f4}
.status.open{background:#daf3e8;color:#176644}
.status.closed{background:#f7dfdf;color:#8d2525}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.code{font-size:30px;letter-spacing:.18em;font-weight:800;background:#fff7df;border:1px solid #f3d68a;border-radius:13px;padding:10px 15px;display:inline-block}
.tablewrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:760px}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}
.table td{padding:11px 10px;border-bottom:1px solid #edf0f3;font-size:13px;vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.amount{font-weight:800;white-space:nowrap}
.empty{text-align:center;padding:40px;color:var(--muted)}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.attrlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.attr{border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.attr strong{display:block}
.attr small{color:var(--muted)}
.modalback{position:fixed;inset:0;background:#10182799;display:grid;place-items:center;padding:18px;z-index:20}
.modal{width:min(500px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 30px 90px #0005}
.modal h3{margin:0 0 8px}
.notice{padding:12px 14px;background:#fff7df;border:1px solid #f1d179;border-radius:12px;margin:14px 0}
.danger{color:var(--red)}
#toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;border-radius:12px;padding:13px 17px;box-shadow:0 10px 40px #0004;opacity:0;transform:translateY(15px);transition:.2s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:none}
.mobilebar,.menu-toggle,.menu-backdrop{display:none}
@media(max-width:980px){.layout{grid-template-columns:1fr}
.sidebar{display:flex;position:fixed;left:0;top:0;width:min(84vw,320px);height:100dvh;z-index:50;transform:translateX(-105%);transition:transform .22s ease;box-shadow:18px 0 50px #08101f55}
.sidebar.open{transform:translateX(0)}
.menu-toggle{display:grid;place-items:center;position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));z-index:45;width:58px;height:58px;border:0;border-radius:18px;background:var(--navy);color:#fff;font-size:0;box-shadow:0 12px 32px #15233b38}
.menu-toggle:before{content:"☰";font-size:34px;line-height:1}
.menu-toggle[aria-expanded="true"]:before{content:"×";font-size:39px}
.menu-backdrop{position:fixed;inset:0;z-index:49;background:#08101f80;backdrop-filter:blur(2px)}
.menu-backdrop.show{display:block}
.main{min-width:0;max-width:100vw;padding:86px 14px 32px;overflow:hidden}
.grid{grid-template-columns:repeat(2,1fr)}
.split{grid-template-columns:1fr}
.split,.split>*,.card,.tablewrap,.report-toolbar,.report-heading{min-width:0;max-width:100%}
.tablewrap{width:100%;overflow-x:auto;overscroll-behavior-inline:contain}
.topbar{padding-right:64px}
.empty{padding:24px 12px;white-space:normal;overflow-wrap:anywhere}
}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}
.metric strong{font-size:22px}
.topbar{display:block}
.actions{margin-top:14px}
.attrlist{grid-template-columns:1fr}
.auth{padding:23px}
.main{padding-inline:12px}
}
:root{--navy:#15233b;--gold:#f2b52b;--muted:#64748b;--red:#c43d48;--green:#198b63;--blue:#3276d2;--line:#dce5ee}
body{background:radial-gradient(circle at 82% 0,#fff0bd 0,transparent 28rem),radial-gradient(circle at 5% 90%,#dcecff 0,transparent 28rem),#eef3f8}
.brand small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9eabbc;margin-top:3px}
.mark{background:linear-gradient(145deg,#ffd66b,var(--gold));border-radius:14px;box-shadow:0 8px 24px #e4a3213d}
.btn{border-radius:13px;transition:transform .16s ease,box-shadow .16s ease,opacity .16s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px #15233b1f}
.btn:active{transform:translateY(0)}
.sidebar{background:linear-gradient(180deg,#15233b 0,#0d1729);box-shadow:10px 0 35px #15233b18}
.nav button.active{box-shadow:inset 3px 0 var(--gold)}
.navbadge{float:right;min-width:22px;height:22px;padding:2px 6px;border-radius:20px;background:var(--gold);color:var(--navy);text-align:center}
.metric,.card{background:linear-gradient(155deg,#fff 0,#fbfdff);border-color:#fff;border-radius:20px;box-shadow:0 10px 32px #15233b0b}
.metric{position:relative;overflow:hidden}
.metric:after{content:"";position:absolute;width:72px;height:72px;border-radius:50%;right:-24px;top:-26px;background:currentColor;opacity:.08}
.metric.blue{color:var(--blue)}
.metric.goldtone{color:#a66d00}
.metric.redtone{color:var(--red)}
.metric.greentone{color:var(--green)}
.metric span{color:var(--muted)}
.metric strong{color:var(--navy)}
.card{animation:rise .28s ease both}
.daycard{background:linear-gradient(145deg,#fff 30%,#fff8e5)}
.attr{background:#f9fbfd;transition:.16s}
.attr:hover{border-color:#b9c9da;background:#fff}
.refund-alert{width:100%;border:0;border-radius:18px;padding:15px 18px;margin:0 0 16px;background:linear-gradient(100deg,#fff2c7,#ffe39a);color:var(--navy);display:flex;align-items:center;gap:13px;text-align:left;box-shadow:0 10px 28px #e4a32124}
.refund-alert .bell{font-size:25px}
.refund-alert span:nth-child(2){display:grid;gap:2px}
.refund-alert small{color:#755c23}
.refund-alert b:last-child{margin-left:auto}
.refund-card{border-color:#f2d886}
.status.waiting{background:#fff0bb;color:#7c5900}
.refund-list{display:grid;gap:10px}
.refund-item{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px;border-radius:15px;background:#fffaf0;border:1px solid #f2dfac}
.refund-item small{display:block;color:var(--muted);margin-top:4px}
.refund-item p{margin:8px 0 0}
.offline-tag{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:20px;background:#e8f1fb;color:#2e659d;font-size:10px;font-weight:800}
.compact{padding:20px}
@keyframes rise{0%{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:none}
}
@media(max-width:600px){.refund-item{display:block}
.refund-item .actions{margin-top:12px}
.refund-alert b:last-child{display:none}
}
.block{display:block;color:var(--muted);margin-top:4px}
.small-text{font-size:12px}
.section-label{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:15px 0 8px}
.overview-attractions{display:grid;gap:10px}
.overview-attraction{padding:13px;border:1px solid var(--line);border-radius:15px;background:#f9fbfd}
.overview-attraction .cardhead{margin-bottom:10px}
.overview-attraction small{display:block;color:var(--muted);margin-top:4px}
.overview-attraction>.btn{margin-top:10px}
.worker-chips,.option-pills{display:flex;flex-wrap:wrap;gap:7px}
.worker-chip,.option-pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:750}
.worker-chip{background:#e5efff;color:#245a9d}
.option-pill.enabled{background:#daf3e8;color:#176644}
.option-pill.disabled{background:#edf1f4;color:#8a94a3;text-decoration:line-through}
.attraction-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.attraction-card{background:linear-gradient(150deg,#fff,#f8fbff);border:1px solid #fff;border-radius:21px;padding:19px;box-shadow:0 10px 32px #15233b0b}
.attraction-card h3{margin:0 0 4px}
.attraction-card .price{font-size:22px}
.attraction-card .actions{margin-top:18px}
.assignment-name{display:inline-block;background:#fff3cd;color:#7b5904;border-radius:9px;padding:6px 9px;font-weight:700}
.task-alert{width:100%;border:0;border-radius:18px;padding:15px 18px;margin:0 0 16px;background:linear-gradient(100deg,#dff5eb,#c3eadc);color:var(--navy);display:flex;align-items:center;gap:13px;text-align:left;box-shadow:0 10px 28px #198b6320}
.task-alert>span:first-child{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:white;font-weight:900}
.task-alert span:nth-child(2){display:grid;gap:2px}
.task-alert b:last-child{margin-left:auto}
.task-list{display:grid;gap:11px}
.task-item{display:flex;align-items:center;gap:14px;padding:15px;border-radius:16px;background:#f8fafc;border:1px solid var(--line)}
.task-item.complete{background:#f1fbf6;border-color:#bde4d2}
.task-item.cancelled{opacity:.62}
.task-check{width:42px;height:42px;flex:none;border-radius:13px;background:#e8eef6;color:var(--navy);display:grid;place-items:center;font-size:18px;font-weight:850}
.task-item.complete .task-check{background:var(--green);color:white}
.task-body{min-width:0;flex:1}
.task-body .cardhead{margin-bottom:5px}
.task-body small{color:var(--muted)}
.task-progress{height:6px;border-radius:99px;background:#dfe7ef;margin-top:10px;overflow:hidden}
.task-progress i{display:block;height:100%;background:var(--green)}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}
.check-card{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:13px;padding:12px;background:#f8fafc;font-weight:700}
.modal textarea{width:100%;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafb;color:var(--navy)}
.report-toolbar{display:flex;align-items:end;gap:16px}
.report-toolbar .field{width:min(380px,100%)}
.report-current{margin-bottom:14px;display:grid;gap:3px}
.report-current span{font-size:11px;color:var(--muted);font-weight:800}
.report-tabs{display:flex;gap:9px;overflow:auto;padding:3px 2px 12px}
.report-tab{min-width:150px;border:1px solid var(--line);background:white;border-radius:14px;padding:12px;text-align:left;color:var(--navy)}
.report-tab strong,.report-tab span{display:block}
.report-tab span{font-size:11px;color:var(--muted);margin-top:4px}
.report-tab.active{border-color:var(--gold);background:#fff7df;box-shadow:0 6px 18px #e4a32120}
.report-heading{display:flex;justify-content:space-between;align-items:center;gap:15px}
.report-heading h2{margin:3px 0}
.report-heading p{margin:5px 0 0}
.payment-summary .cardhead{margin-bottom:13px}
.payment-summary .cardhead p{margin:4px 0 0}
.payment-breakdown{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}
.payment-stat{position:relative;overflow:hidden;min-height:132px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#f8fafc}
.payment-stat:after{content:"";position:absolute;width:64px;height:64px;border-radius:50%;right:-24px;top:-25px;background:currentColor;opacity:.09}
.payment-stat.cash{color:var(--green);background:#f1fbf6}
.payment-stat.cardpay{color:var(--blue);background:#f2f7ff}
.payment-stat.transfer{color:#7657c9;background:#f6f3ff}
.payment-stat.child{color:#a66d00;background:#fff9e8}
.payment-stat.freepay{color:#56677c;background:#f5f7fa}
.payment-stat .payment-name{display:block;color:currentColor;font-size:12px;font-weight:850}
.payment-stat strong{display:block;color:var(--navy);font-size:24px;margin:10px 0 6px}
.payment-stat small,.payment-stat em{display:block;color:var(--muted);font-size:11px;line-height:1.45;font-style:normal}
.payment-stat em{margin-top:4px;color:currentColor;font-weight:750}
@media(max-width:1100px){.attraction-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1050px){.payment-breakdown{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.attraction-board{grid-template-columns:1fr}.check-grid{grid-template-columns:1fr}.task-item{align-items:flex-start;flex-wrap:wrap}.task-body{min-width:calc(100% - 60px)}.report-heading{display:block}.report-heading .option-pills{margin-top:14px}.task-alert b:last-child{display:none}.payment-breakdown{grid-template-columns:1fr 1fr}.payment-stat{min-height:124px;padding:13px}.payment-stat strong{font-size:21px}}
</style>
</head>

<script type="module">function G2(base,key){
  const storageKey="park_manager_session_v1",listeners=new Set();let session=null;
  try{session=JSON.parse(localStorage.getItem(storageKey)||"null")}catch{}
  const save=s=>{session=s;s?localStorage.setItem(storageKey,JSON.stringify(s)):localStorage.removeItem(storageKey)};
  const errorOf=(status,data)=>({message:data?.message||data?.msg||data?.error_description||data?.error||`HTTP ${status}`});
  async function raw(path,{method="GET",body,token,headers={}}={}){const h={apikey:key,...headers};if(token)h.Authorization=`Bearer ${token}`;if(body!==undefined)h["Content-Type"]="application/json";let res;try{res=await fetch(base+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)})}catch(e){return{data:null,error:{message:"Сервер недоступен: "+e.message},status:0}}const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}return res.ok?{data,error:null,status:res.status}:{data:null,error:errorOf(res.status,data),status:res.status}}
  const normalize=d=>{if(!d)return null;const expires_in=Number(d.expires_in||3600);return{...d,expires_at:Math.floor(Date.now()/1000)+expires_in}};
  async function refresh(){if(!session?.refresh_token)return session;if(session.expires_at&&session.expires_at>Date.now()/1000+90)return session;const r=await raw("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:session.refresh_token}});if(r.error){save(null);return null}save(normalize(r.data));return session}
  async function bearer(){await refresh();return session?.access_token||key}
  async function api(path,options={}){return raw(path,{...options,token:await bearer()})}
  class Query{
    constructor(table){this.table=table;this.method="GET";this.params=new URLSearchParams;this.body=undefined;this.headers={}}
    select(cols="*"){this.params.set("select",cols);if(this.method!=="GET")this.headers.Prefer="return=representation";return this}
    insert(value){this.method="POST";this.body=value;this.headers.Prefer="return=representation";return this}
    update(value){this.method="PATCH";this.body=value;this.headers.Prefer="return=representation";return this}
    delete(){this.method="DELETE";this.headers.Prefer="return=representation";return this}
    eq(column,value){this.params.append(column,"eq."+String(value));return this}
    order(column,{ascending=true}={}){this.params.append("order",`${column}.${ascending?"asc":"desc"}`);return this}
    limit(value){this.params.set("limit",String(value));return this}
    range(from,to){this.headers.Range=`${from}-${to}`;this.headers["Range-Unit"]="items";return this}
    single(){this.headers.Accept="application/vnd.pgrst.object+json";return this}
    then(resolve,reject){return this.run().then(resolve,reject)}
    run(){const q=this.params.toString();return api(`/rest/v1/${this.table}${q?"?"+q:""}`,{method:this.method,body:this.body,headers:this.headers})}
  }
  const auth={
    onAuthStateChange(cb){listeners.add(cb);return{data:{subscription:{unsubscribe:()=>listeners.delete(cb)}}}},
    async getSession(){const p=new URLSearchParams(location.hash.replace(/^#/,""));if(p.get("access_token")){const access_token=p.get("access_token"),refresh_token=p.get("refresh_token"),expires_in=Number(p.get("expires_in")||3600);let s=normalize({access_token,refresh_token,expires_in,token_type:"bearer"});const u=await raw("/auth/v1/user",{token:access_token});if(!u.error)s.user=u.data;save(s);if(p.get("type")==="recovery")listeners.forEach(cb=>cb("PASSWORD_RECOVERY",session))}return{data:{session},error:null}},
    async signInWithPassword({email,password}){const r=await raw("/auth/v1/token?grant_type=password",{method:"POST",body:{email,password}});if(!r.error)save(normalize(r.data));return r.error?{data:{session:null},error:r.error}:{data:{session},error:null}},
    async signOut(){if(session?.access_token)await raw("/auth/v1/logout",{method:"POST",token:session.access_token});save(null);listeners.forEach(cb=>cb("SIGNED_OUT",null));return{error:null}},
    async resetPasswordForEmail(email,{redirectTo}={}){const q=redirectTo?`?redirect_to=${encodeURIComponent(redirectTo)}`:"";return raw("/auth/v1/recover"+q,{method:"POST",body:{email}})},
    async updateUser(values){await refresh();const r=await raw("/auth/v1/user",{method:"PUT",body:values,token:session?.access_token});if(!r.error&&session){session.user=r.data;save(session)}return r}
  };
  return{auth,from:t=>new Query(t),rpc:(name,args)=>api(`/rest/v1/rpc/${name}`,{method:"POST",body:args}),functions:{invoke:(name,{body}={})=>api(`/functions/v1/${name}`,{method:"POST",body})},channel(){const callbacks=new Set;return{on(...args){const cb=args.at(-1);if(typeof cb==="function")callbacks.add(cb);return this},subscribe(){this.timer=setInterval(()=>callbacks.forEach(cb=>cb()),15000);return this}}},removeChannel(ch){clearInterval(ch?.timer)}}
}
